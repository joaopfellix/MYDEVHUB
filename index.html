<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Dev Hub - Ideias que viram códigos</title>
<meta name="description" content="My Dev Hub: o depósito de links de projetos, sites e ideias de João Pedro Félix.">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<!-- Biblioteca do Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#000;--panel:#050912;--panel2:#091020;--line:#13233f;--blue:#1646ff;--blue2:#0a2a9e;--neon:#1ad1ff;--white:#f4f8ff;--mut:#8da2c8;--ok:#2be6a0;--bad:#ff5d7a;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--white);font:400 1rem/1.6 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
h1,h2,h3,.disp{font-family:Unbounded,"Segoe UI",system-ui,sans-serif;line-height:1.1;font-weight:700}
button{font:inherit;color:inherit}
a{color:var(--neon)}
:focus-visible{outline:2px solid var(--neon);outline-offset:3px;border-radius:6px}
svg.i{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}

/* progresso de scroll */
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--blue),var(--neon));box-shadow:0 0 14px var(--neon);z-index:300}

/* navegação */
nav.top{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:1.2rem;padding:.8rem clamp(1rem,4vw,2.5rem);background:rgba(0,0,0,.55);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s,background .3s}
nav.top.solid{border-color:var(--line);background:rgba(0,0,0,.82)}
.logo{font:800 1.05rem Unbounded,system-ui,sans-serif;text-decoration:none;color:var(--white);white-space:nowrap;display:flex;align-items:center;gap:.5rem;background:none;border:0;cursor:pointer}
.logo b{display:inline-grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:8px;background:var(--blue);box-shadow:0 0 16px rgba(26,209,255,.6);font-size:.8rem}
.links{display:flex;gap:.2rem;margin-left:auto}
.links button{background:none;border:0;padding:.45rem .8rem;border-radius:8px;color:var(--mut);cursor:pointer;font-weight:700;font-size:.92rem;transition:color .2s,background .2s}
.links button:hover,.links button.on{color:var(--white);background:rgba(26,209,255,.1)}
.links button.on{box-shadow:inset 0 -2px 0 var(--neon)}
.acts{display:flex;gap:.5rem;align-items:center}
@media(max-width:860px){.links{display:none}.acts{margin-left:auto}}

/* botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.7rem 1.2rem;border-radius:10px;border:1px solid var(--neon);background:var(--neon);color:#001018;font-weight:800;font-size:.95rem;cursor:pointer;text-decoration:none;transition:box-shadow .2s,transform .2s,background .2s}
.btn:hover{box-shadow:0 0 0 3px rgba(26,209,255,.2),0 0 26px rgba(26,209,255,.6);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--white);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--neon);box-shadow:0 0 18px rgba(26,209,255,.25)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{background:transparent;color:var(--bad);border-color:rgba(255,93,122,.4)}
.btn.danger:hover{box-shadow:0 0 18px rgba(255,93,122,.3);border-color:var(--bad)}
.btn.sm{padding:.42rem .8rem;font-size:.82rem;border-radius:8px}
.btn[disabled]{opacity:.5;pointer-events:none}
label{display:block;font-size:.85rem;font-weight:700;color:var(--mut);margin:.9rem 0 .3rem}
input,textarea,select{width:100%;background:#02050c;border:1px solid var(--line);color:var(--white);border-radius:10px;padding:.7rem .85rem;font:inherit;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--neon);box-shadow:0 0 0 3px rgba(26,209,255,.18)}
textarea{min-height:110px;resize:vertical}
.err{color:var(--bad);font-size:.88rem;min-height:1.2em;margin-top:.6rem}
.hint{color:var(--mut);font-size:.85rem}

/* hero */
.hero{position:relative;min-height:100vh;display:grid;place-items:center;text-align:center;padding:7rem 1.2rem 5rem;overflow:hidden}
.grid-bg{position:absolute;inset:-25% -10% 0;background-image:linear-gradient(rgba(26,209,255,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(26,209,255,.13) 1px,transparent 1px);background-size:58px 58px;-webkit-mask-image:radial-gradient(ellipse at 50% 42%,#000 15%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 42%,#000 15%,transparent 70%);will-change:transform}
.glow{position:absolute;width:62vmax;height:62vmax;left:50%;top:38%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(22,70,255,.38),transparent 60%);filter:blur(24px);animation:breathe 7s ease-in-out infinite}
@keyframes breathe{50%{opacity:.6;transform:translate(-50%,-50%) scale(1.08)}}
.hero-in{position:relative;max-width:980px;will-change:transform,opacity}
.hello{display:inline-block;border:1px solid var(--line);background:rgba(5,9,18,.7);padding:.55rem 1.1rem;border-radius:999px;font-size:.95rem;color:var(--mut);animation:rise .9s .1s both}
.hello b{color:var(--white)}
.hero h1{font-weight:800;font-size:clamp(2.6rem,9.5vw,7.4rem);letter-spacing:-.03em;margin:1.4rem 0 .9rem;text-shadow:0 0 34px rgba(26,209,255,.55),0 0 90px rgba(22,70,255,.5);animation:rise 1s .25s both}
.tagline{font:500 clamp(1.1rem,2.6vw,1.7rem) Unbounded,system-ui,sans-serif;color:var(--neon);animation:rise 1s .4s both}
.intro{max-width:560px;margin:1.3rem auto 0;color:var(--mut);animation:rise 1s .55s both}
.cta{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;margin-top:2rem;animation:rise 1s .7s both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.cue{position:absolute;bottom:1.6rem;left:50%;transform:translateX(-50%);color:var(--mut);font-size:.8rem;display:grid;gap:.5rem;justify-items:center}
.cue i{width:22px;height:36px;border:2px solid var(--mut);border-radius:12px;position:relative}
.cue i::after{content:"";position:absolute;left:50%;top:6px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--neon);animation:wheel 1.6s infinite}
@keyframes wheel{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(14px)}}

/* ideia -> código (scroll) */
.scrub{height:280vh;position:relative}
.stage{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;justify-content:center;padding:5rem clamp(1rem,5vw,4rem) 2rem;max-width:1200px;margin:auto}
.stage h2{font-size:clamp(1.5rem,4vw,2.6rem);margin-bottom:.5rem}
.stage>p{color:var(--mut);margin-bottom:2rem;max-width:520px}
.duo{display:grid;grid-template-columns:minmax(0,.8fr) 70px minmax(0,1.3fr);align-items:center;gap:0}
.idea{--p:0;background:var(--panel);border:1px solid rgba(26,209,255,calc(.15 + var(--p)*.7));border-radius:var(--r);padding:1.5rem;box-shadow:0 0 calc(var(--p)*40px) rgba(26,209,255,.28);transform:translateX(calc(var(--p)*-10px)) scale(calc(1 - var(--p)*.05));transition:box-shadow .2s}
.idea small{color:var(--neon);font-weight:800}
.idea p{font:600 1.15rem/1.4 Unbounded,system-ui,sans-serif;margin-top:.6rem}
.wire{height:3px;background:var(--line);position:relative;overflow:hidden;border-radius:3px;margin:0 6px}
.wire i{position:absolute;inset:0;background:var(--neon);box-shadow:0 0 12px var(--neon);transform-origin:left;transform:scaleX(var(--p,0))}
.win{background:#02050d;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 20px 70px rgba(22,70,255,.22)}
.win header{display:flex;align-items:center;gap:.4rem;padding:.7rem 1rem;border-bottom:1px solid var(--line);background:var(--panel2);font-size:.8rem;color:var(--mut)}
.win header span{width:10px;height:10px;border-radius:50%;background:#1b2b4d}
.win header em{margin-left:.6rem;font-style:normal}
.win pre{padding:1.2rem 1.3rem;min-height:15.5rem;font:500 clamp(.78rem,1.6vw,.95rem)/1.7 "JetBrains Mono",ui-monospace,Consolas,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:#cfe0ff}
.s{color:#7fe3ff}.k{color:#5b8cff}.n{color:#ffd37a}.c{color:#5c7099}
.caret{display:inline-block;width:.55ch;height:1.1em;background:var(--neon);vertical-align:-.2em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pub{display:inline-flex;align-items:center;gap:.5rem;margin-top:1.2rem;padding:.5rem 1rem;border-radius:999px;border:1px solid rgba(43,230,160,.5);color:var(--ok);font-weight:800;opacity:0;transform:translateY(10px);transition:.4s}
.pub.on{opacity:1;transform:none;box-shadow:0 0 22px rgba(43,230,160,.3)}
@media(max-width:820px){.duo{grid-template-columns:1fr}.wire{width:3px;height:36px;margin:6px auto}.wire i{transform-origin:top;transform:scaleY(var(--p,0))}.scrub{height:240vh}}

/* hub / abas */
.hub{max-width:1180px;margin:0 auto;padding:4rem clamp(1rem,4vw,2rem) 6rem;scroll-margin-top:60px}
.tabbar{position:sticky;top:58px;z-index:50;display:flex;gap:.4rem;padding:.5rem;margin:0 auto 2.4rem;width:max-content;max-width:100%;background:rgba(5,9,18,.85);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
.tabbar button{background:none;border:0;padding:.65rem 1.3rem;border-radius:10px;color:var(--mut);font-weight:800;cursor:pointer;white-space:nowrap;transition:.2s}
.tabbar button:hover{color:var(--white)}
.tabbar button.on{background:var(--blue);color:#fff;box-shadow:0 0 22px rgba(22,70,255,.7)}
.phead{display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap;margin-bottom:1.4rem}
.phead h2{font-size:clamp(1.5rem,3.4vw,2.3rem)}
.phead p{color:var(--mut);margin-top:.4rem}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.6rem}
.chip{border:1px solid var(--line);background:transparent;padding:.4rem .9rem;border-radius:999px;color:var(--mut);cursor:pointer;font-weight:700;font-size:.85rem;transition:.2s}
.chip:hover{border-color:var(--neon);color:var(--white)}
.chip.on{background:rgba(26,209,255,.14);border-color:var(--neon);color:var(--neon)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.2rem}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1.3rem;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;gap:.7rem;transition:border-color .25s,transform .25s}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(26,209,255,.16),transparent 60%);opacity:0;transition:opacity .25s;pointer-events:none}
.card:hover{border-color:rgba(26,209,255,.6);transform:translateY(-4px)}
.card:hover::before{opacity:1}
.card h3{font-size:1.1rem;line-height:1.25}
.card p{color:var(--mut);font-size:.93rem;flex:1}
.tg{align-self:flex-start;font-size:.75rem;font-weight:800;padding:.2rem .65rem;border-radius:999px;border:1px solid}
.t-Projeto{color:var(--neon);border-color:rgba(26,209,255,.5);background:rgba(26,209,255,.08)}
.t-Site{color:#7da2ff;border-color:rgba(125,162,255,.5);background:rgba(22,70,255,.12)}
.t-Ideia{color:#fff;border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.06)}
.foot{display:flex;gap:1rem;align-items:center;color:var(--mut);font-size:.85rem;flex-wrap:wrap}
.foot span{display:inline-flex;align-items:center;gap:.35rem}
.foot .host{margin-left:auto;color:var(--mut)}
.cadm{display:flex;gap:.4rem;position:absolute;top:.8rem;right:.8rem;z-index:2}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:2.4rem;text-align:center;color:var(--mut)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:clamp(1.2rem,3vw,2rem)}
.hist{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1.4rem}
.hist .txt p{margin-bottom:1rem;color:#c6d4ee;max-width:68ch}
.who dl{display:grid;gap:.9rem;margin-top:1rem}
.who dt{color:var(--mut);font-size:.82rem;font-weight:700}
.who dd{font-weight:700;font-size:1.05rem}
.ctl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.4rem}
.wa{display:flex;align-items:center;gap:1rem;padding:1.2rem;border-radius:var(--r);border:1px solid rgba(26,209,255,.4);background:linear-gradient(135deg,rgba(22,70,255,.25),rgba(26,209,255,.06));text-decoration:none;color:var(--white);transition:.25s}
.wa:hover{box-shadow:0 0 36px rgba(26,209,255,.35);transform:translateY(-2px)}
.wa strong{font-size:1.2rem;display:block}
.cl{display:grid;gap:.6rem;margin-top:1rem}
.cl a{display:flex;gap:.6rem;align-items:center;padding:.75rem 1rem;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--white);transition:.2s}
.cl a:hover{border-color:var(--neon)}
@media(max-width:820px){.hist,.ctl{grid-template-columns:1fr}}
footer{border-top:1px solid var(--line);padding:2rem clamp(1rem,4vw,2.5rem);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;color:var(--mut);font-size:.9rem}
footer button{background:none;border:0;color:var(--mut);cursor:pointer;display:inline-flex;gap:.4rem;align-items:center}
footer button:hover{color:var(--neon)}

/* revelar no scroll */
.rv{opacity:0;transform:translateY(34px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.l{transform:translateX(-40px)}.rv.r{transform:translateX(40px)}
.rv.in{opacity:1;transform:none}
#top{position:fixed;right:1.2rem;bottom:1.2rem;z-index:90;width:46px;height:46px;border-radius:50%;border:1px solid var(--neon);background:rgba(0,0,0,.8);color:var(--neon);cursor:pointer;display:grid;place-items:center;opacity:0;pointer-events:none;transform:translateY(12px);transition:.3s;box-shadow:0 0 18px rgba(26,209,255,.35)}
#top.on{opacity:1;pointer-events:auto;transform:none}

/* modal e admin */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.74);backdrop-filter:blur(6px);display:none;z-index:200;overflow:auto;padding:5vh 1rem}
.ov.open{display:block}
.md{max-width:480px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:1.8rem;position:relative;box-shadow:0 0 70px rgba(22,70,255,.28);animation:pop .28s cubic-bezier(.2,.8,.2,1)}
.md.wide{max-width:760px}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.x{position:absolute;top:1rem;right:1rem;background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--mut)}
.x:hover{color:var(--neon);border-color:var(--neon)}
.md h2{font-size:1.35rem;margin-bottom:.3rem;padding-right:2.5rem}
.md>.sub{color:var(--mut);margin-bottom:1.4rem}
.react{display:flex;gap:.6rem;margin:1.1rem 0;flex-wrap:wrap}
.rb{display:inline-flex;gap:.5rem;align-items:center;padding:.6rem 1.1rem;border-radius:12px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:800;transition:.2s}
.rb:hover{border-color:var(--neon)}
.rb.up.on{background:rgba(43,230,160,.14);border-color:var(--ok);color:var(--ok)}
.rb.dn.on{background:rgba(255,93,122,.14);border-color:var(--bad);color:var(--bad)}
.cm{border-top:1px solid var(--line);margin-top:1.2rem;padding-top:1rem}
.cm h3{font-size:1rem;margin-bottom:.8rem}
.cmi{border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;margin-bottom:.6rem;background:var(--panel2)}
.cmi header{display:flex;justify-content:space-between;gap:.5rem;font-size:.82rem;color:var(--mut);margin-bottom:.2rem}
.cmi header b{color:var(--white)}
.cmi p{overflow-wrap:anywhere}
.lock{border:1px dashed var(--line);border-radius:12px;padding:1rem;text-align:center;color:var(--mut)}
.lock .btn{margin-top:.7rem}
.admin{position:fixed;inset:0;z-index:150;background:var(--bg);display:none;grid-template-columns:230px minmax(0,1fr);overflow:hidden}
.admin.open{display:grid}
.admin aside{border-right:1px solid var(--line);padding:1.2rem .8rem;display:flex;flex-direction:column;gap:.3rem;background:var(--panel);overflow:auto}
.admin aside .logo{margin-bottom:1rem;padding:0 .4rem}
.admin aside button.t{background:none;border:0;text-align:left;padding:.65rem .8rem;border-radius:10px;color:var(--mut);cursor:pointer;font-weight:700;display:flex;gap:.6rem;align-items:center}
.admin aside button.t:hover{color:var(--white);background:rgba(26,209,255,.08)}
.admin aside button.t.on{background:var(--blue);color:#fff}
.admin main{overflow:auto;padding:clamp(1rem,3vw,2.2rem)}
.admin main h2{font-size:1.6rem;margin-bottom:1.2rem}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1rem}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem}
.stat b{display:block;font:800 2rem Unbounded,sans-serif;color:var(--neon)}
.stat span{color:var(--mut);font-size:.85rem}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:.75rem 1rem;border-bottom:1px solid var(--line);font-size:.92rem;vertical-align:middle}
th{color:var(--mut);font-size:.8rem;background:var(--panel)}
tr:last-child td{border-bottom:0}
td .row{display:flex;gap:.4rem;flex-wrap:wrap}
.bar2{display:flex;height:8px;border-radius:6px;overflow:hidden;background:var(--line);margin:.5rem 0}
.bar2 i{display:block;height:100%}
.rx{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem;margin-bottom:1rem}
.rx small{color:var(--mut);display:block}
.sec{margin-bottom:1.4rem}
.sec h3{font-size:1.05rem;margin-bottom:.4rem}
#toast{position:fixed;left:50%;bottom:1.5rem;transform:translate(-50%,30px);background:var(--panel2);border:1px solid var(--neon);padding:.7rem 1.2rem;border-radius:12px;z-index:400;opacity:0;pointer-events:none;transition:.3s;box-shadow:0 0 28px rgba(26,209,255,.3);max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{border-color:var(--bad)}
@media(max-width:820px){.admin.open{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.admin aside{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:.6rem}.admin aside .logo{display:none}.admin aside button.t{white-space:nowrap}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="bar"></div>
<nav class="top" id="nav"></nav>
<main>
  <header class="hero" id="inicio"></header>
  <section class="scrub" id="scrub"></section>
  <section class="hub" id="hub"></section>
</main>
<footer id="footer"></footer>
<button id="top" aria-label="Voltar ao topo" data-act="toTop"><svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
<div class="ov" id="modal" aria-hidden="true"><div class="md" id="mbody" role="dialog" aria-modal="true"></div></div>
<div class="admin" id="admin"></div>
<div id="toast" role="status"></div>
<noscript><p style="padding:2rem">Ative o JavaScript para ver o My Dev Hub.</p></noscript>

<script>
"use strict";

/* ================= SUPABASE CONFIG ================= */
const SUPABASE_URL = 'https://rfmksbtnzhrekngezpjj.supabase.co';
const SUPABASE_ANON_KEY = 'SUA_CHAVE_ANON_PUBLIC_AQUI'; // Substitua pela sua chave Publishable key
const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= CONFIGURAÇÃO DO DONO ================= */
const CFG={ADMIN_EMAIL:'admin@devhub.com',ADMIN_PASS:'devhub@2026'};

/* ================= ARMAZENAMENTO ================= */
const KEY='mydevhub_v1';
let LS=null;try{localStorage.setItem('_t','1');localStorage.removeItem('_t');LS=localStorage}catch(e){}
const mem={};
const store={get:k=>{try{return LS?LS.getItem(k):(mem[k]??null)}catch(e){return mem[k]??null}},set:(k,v)=>{try{LS?LS.setItem(k,v):(mem[k]=v)}catch(e){mem[k]=v}}};

const ico=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
const fixUrl=u=>{u=String(u||'').trim();return /^https?:\/\//i.test(u)?u:'https://'+u};
const host=u=>{try{return new URL(fixUrl(u)).hostname.replace(/^www\./,'')}catch(e){return ''}};
let toastT;function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='on'+(bad?' bad':'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='',3200)}

async function hash(s){
  try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('devhub:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  let h=5381;for(const c of 'devhub:'+s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'f'+h.toString(16);
}

async function initSupabaseAuth(){
  try {
    const { data: { session } } = await _supabase.auth.getSession();
    if(session && session.user){
      supabaseUser = session.user;
    }
    _supabase.auth.onAuthStateChange((_event, session) => {
      supabaseUser = session ? session.user : null;
      renderNav();
      refreshProject();
    });
  } catch(e){console.error(e)}
}

};

/* ================= SCROLL ================= */
let ticking=false;
function updateScroll(force){
  const y=scrollY,H=innerHeight,max=document.documentElement.scrollHeight-H;
  $('#bar'].style.width=(max>0?y/max*100:0)+'%';
  $('#nav').classList.toggle('solid',y>30);
  $('#top').classList.toggle('on',y>H*.8);
  const hp=clamp(y/H,0,1),hi=$('#heroin'),gb=$('#gridbg');
  if(hi&&!matchMedia('(prefers-reduced-motion:reduce)').matches){hi.style.transform=`translateY(${y*.32}px) scale(${1-hp*.1})`;hi.style.opacity=String(1-hp*1.15)}
  if(gb)gb.style.transform=`translateY(${y*.18}px)`;
  const sc=$('#scrub');
  if(sc){
    const r=sc.getBoundingClientRect(),p=clamp(-r.top/(r.height-H),0,1);
    const idea=$('#idea');if(idea)idea.style.setProperty('--p',p.toFixed(3));
    const w=$('#wire');if(w)w.style.setProperty('--p',clamp(p*1.6,0,1).toFixed(3));
    const n=Math.round(clamp(p/.85,0,1)*TOTAL);
    if(n!==lastN||force){lastN=n;const pre=$('#code');if(pre)pre.innerHTML=hl(FULL.slice(0,n))+(n<TOTAL?'<i class="caret"></i>':'');}
    const pub=$('#pub');if(pub)pub.classList.toggle('on',p>.93);
  }
  markNav();ticking=false;
}
addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(()=>updateScroll())}},{passive:true});
addEventListener('resize',()=>updateScroll(true));
let io;
function watchReveals(){
  if(!('IntersectionObserver' in window)){document.querySelectorAll('.rv').forEach(e=>e.classList.add('in'));return}
  if(!io)io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12,rootMargin:'0px 0px -6% 0px'});
  document.querySelectorAll('.rv:not(.in)').forEach(e=>io.observe(e));
}
document.addEventListener('mousemove',e=>{const c=e.target.closest&&e.target.closest('.card');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')}});

  <div style="margin-top:1rem">${cms.map(c=>`<div class="cmi"><header><b>${esc(c.name)}</b><span>${fdate(c.ts)}${adminOn?` <button class="btn danger sm" data-act="delComment" data-id="${c.id}" aria-label="Excluir comentário">${ico('del')}</button>`:''}</span></header><p>${esc(c.text).replace(/\n/g,'<br>')}</p></div>`).join('')||'<p class="hint">Ainda sem comentários. Seja a primeira pessoa a comentar.</p>'}</div></div>`;
}
function showProject(id){const p=S.projects.find(x=>x.id===id);if(!p)return;curPid=id;const keep=$('#modal').scrollTop;openModal(projectHTML(p),true);$('#modal').scrollTop=keep}
function refreshProject(){if(curPid&&$('#modal').classList.contains('open')){const p=S.projects.find(x=>x.id===curPid);if(p){const keep=$('#modal').scrollTop;$('#mbody').innerHTML=`<button class="x" data-act="closeModal" aria-label="Fechar">${ico('x')}</button>`+projectHTML(p);$('#modal').scrollTop=keep}}if(tab==='projetos'&&!document.getElementById('admin').classList.contains('open'))renderHub(true)}

/* ================= AUTENTICAÇÃO EXCLUSIVA GOOGLE ================= */
function openAuth(msg){
  afterAuth=curPid;
  openModal(`<h2>Acesse sua conta</h2><p class="sub">${esc(msg||'Entre com sua conta Google para comentar e reagir aos projetos.')}</p>
  
  <button class="btn" style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:0.9rem;" data-act="googleLogin">
    <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.95H1.19v3.15C3.17 21.31 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.25c-.25-.72-.38-1.49-.38-2.25s.13-1.53.38-2.25V6.6H1.19C.43 8.13 0 9.87 0 12s.43 3.87 1.19 5.4l4.09-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.69 1.19 6.6l4.09 3.15c.95-2.84 3.6-4.95 6.72-4.95z"/></svg>
    Continuar com Google
  </button>`);
}

const forms={
  comment(f){
    const u=me();if(!u)return openAuth('Entre com o Google para comentar.');
    const t=f.t.value.trim();if(!t)return err(f,'Escreva algo antes de comentar.');
    S.comments.push({id:uid(),pid:curPid,uid:u.id,name:u.name,text:t.slice(0,500),ts:Date.now()});save();refreshProject();toast('Comentário publicado.');
  },
  wamsg(f){const n=f.n.value.trim(),m=f.m.value.trim();window.open(waLink(`Olá, sou ${n}. ${m}`),'_blank','noopener')},
  project(f){
    const d={title:f.title.value.trim(),desc:f.desc.value.trim(),url:fixUrl(f.url.value),tag:f.tag.value};
    if(!d.title||!f.url.value.trim())return err(f,'Preencha o título e o link.');
    if(f.dataset.id){Object.assign(S.projects.find(p=>p.id===f.dataset.id),d);toast('Projeto atualizado.')}
    else{S.projects.push({id:uid(),ts:Date.now(),...d});toast('Projeto adicionado.')}
    save();closeModal();afterAdminChange();
  },
  content(f){
    const sec=f.dataset.sec;
    if(sec==='history')S.content.history=f.history.value;
    else for(const k of Object.keys(S.content[sec]))S.content[sec][k]=f[k].value.trim();
    save();if($('#modal').classList.contains('open'))closeModal();toast('Alterações salvas.');afterAdminChange();
  },
  async adminlogin(f){
    if(Date.now()<lockUntil)return err(f,'Muitas tentativas. Aguarde alguns segundos.');
    const ok=f.email.value.trim().toLowerCase()===S.admin.email.toLowerCase()&&(await hash(f.pass.value))===S.admin.hash;
    if(!ok){if(++tries>=5){lockUntil=Date.now()+30000;tries=0}return err(f,'Acesso negado. Esta área é somente para o dono.')}
    tries=0;adminOn=true;save();closeModal();renderAll(true);toast('Acesso do dono liberado.');openAdmin();
  },
  async security(f){
    if((await hash(f.cur.value))!==S.admin.hash)return err(f,'Senha atual incorreta.');
    const em=f.email.value.trim().toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))return err(f,'E-mail inválido.');
    S.admin.email=em;
    if(f.np.value){if(f.np.value.length<8)return err(f,'A nova senha precisa ter 8 caracteres ou mais.');S.admin.hash=await hash(f.np.value)}
    save();f.reset();err(f,'');toast('Dados do dono atualizados.');
  }
};
let tries=0,lockUntil=0;
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(f){e.preventDefault();forms[f.dataset.form]&&forms[f.dataset.form](f)}});

/* ================= FORMULÁRIOS DO DONO ================= */
function projectForm(p){
  p=p||{};
  return `<h2>${p.id?'Editar projeto':'Novo projeto'}</h2><p class="sub">Aparece na aba Projetos para todos os visitantes.</p>
  <form data-form="project" data-id="${p.id||''}"><label for="pt">Título</label><input id="pt" name="title" maxlength="80" value="${esc(p.title)}" required>
  <label for="pd">Descrição</label><textarea id="pd" name="desc" maxlength="300">${esc(p.desc)}</textarea>
  <label for="pu">Link</label><input id="pu" name="url" placeholder="https://" value="${esc(p.url)}" required>
  <label for="pg">Categoria</label><select id="pg" name="tag">${['Projeto','Site','Ideia'].map(t=>`<option ${p.tag===t?'selected':''}>${t}</option>`).join('')}</select>
  <div class="err" role="alert"></div><button class="btn" style="margin-top:.6rem">Salvar projeto</button></form>`;
}
const LBL={name:'Seu nome',age:'Idade',city:'Cidade',site:'Nome do site',tagline:'Frase de efeito',intro:'Texto de apresentação',whatsapp:'WhatsApp',email:'E-mail',github:'GitHub (link)',instagram:'Instagram (link)',note:'Texto da aba'};
function contentForm(sec){
  const titles={hero:'Apresentação',history:'História da página',contact:'Contato'};
  let fields;
  if(sec==='history')fields=`<label for="ch">Texto (separe parágrafos com uma linha em branco)</label><textarea id="ch" name="history" style="min-height:260px">${esc(S.content.history)}</textarea>`;
  else fields=Object.keys(S.content[sec]).map(k=>{const big=k==='intro'||k==='note';return `<label for="c-${sec}-${k}">${LBL[k]}</label>${big?`<textarea id="c-${sec}-${k}" name="${k}">${esc(S.content[sec][k])}</textarea>`:`<input id="c-${sec}-${k}" name="${k}" value="${esc(S.content[sec][k])}">`}`}).join('');
  return `<form data-form="content" data-sec="${sec}"><h3 style="margin-bottom:.3rem">${titles[sec]}</h3>${fields}<div class="err" role="alert"></div><button class="btn" style="margin-top:.8rem">Salvar ${titles[sec].toLowerCase()}</button></form>`;
}

/* ================= PAINEL DO DONO ================= */
function openAdmin(){$('#admin').classList.add('open');document.body.style.overflow='hidden';renderAdmin()}
function closeAdmin(){$('#admin').classList.remove('open');document.body.style.overflow='';renderAll(true)}
function afterAdminChange(){if($('#admin').classList.contains('open'))renderAdmin();else renderAll(true)}
function renderAdmin(){
  const tabs=[['resumo','chart','Resumo'],['projetos','grid','Projetos'],['reacoes','heart','Reações e comentários'],['pagina','edit','Editar a página'],['seguranca','lock','Segurança']];
  const up=Object.values(S.votes).reduce((a,v)=>a+Object.values(v).filter(x=>x===1).length,0),dn=Object.values(S.votes).reduce((a,v)=>a+Object.values(v).filter(x=>x===-1).length,0);
  let main='';
  if(adminTab==='resumo')main=`<h2>Resumo</h2><div class="stats">${[['Projetos',S.projects.length],['Gostei',up],['Não gostei',dn],['Comentários',S.comments.length]].map(s=>`<div class="stat"><b>${s[1]}</b><span>${s[0]}</span></div>`).join('')}</div>`;
  if(adminTab==='projetos')main=`<h2>Projetos</h2><p style="margin-bottom:1rem"><button class="btn" data-act="newProject">${ico('plus')} Enviar novo projeto</button></p><div class="tbl"><table><tr><th>Título</th><th>Categoria</th><th>Gostei</th><th>Não gostei</th><th>Ações</th></tr>${S.projects.map(p=>{const v=votesOf(p.id);return `<tr><td>${esc(p.title)}<br><a href="${esc(fixUrl(p.url))}" target="_blank" rel="noopener" class="hint">${esc(host(p.url))}</a></td><td>${esc(p.tag)}</td><td>${v.up}</td><td>${v.dn}</td><td><div class="row"><button class="btn ghost sm" data-act="editProject" data-id="${p.id}">${ico('edit')} Editar</button><button class="btn danger sm" data-act="delProject" data-id="${p.id}">${ico('del')}</button></div></td></tr>`}).join('')||'<tr><td colspan="5">Nenhum projeto.</td></tr>'}</table></div>`;
  if(adminTab==='reacoes'){
    main=`<h2>Reações e comentários</h2>${S.projects.map(p=>{const v=votesOf(p.id),t=v.up+v.dn,cms=cmOf(p.id).sort((a,b)=>b.ts-a.ts);
    return `<div class="rx"><b>${esc(p.title)}</b><div class="bar2"><i style="width:${t?v.up/t*100:0}%;background:var(--ok)"></i><i style="width:${t?v.dn/t*100:0}%;background:var(--bad)"></i></div>
    <div style="margin-top:.8rem">${cms.map(c=>`<div class="cmi"><header><b>${esc(c.name)}</b><span>${fdate(c.ts)} <button class="btn danger sm" data-act="delComment" data-id="${c.id}">${ico('del')}</button></span></header><p>${esc(c.text)}</p></div>`).join('')||'<small>Sem comentários.</small>'}</div></div>`}).join('')||'<div class="empty">Sem projetos.</div>'}`;
  }
  if(adminTab==='pagina')main=`<h2>Editar a página</h2>${['hero','history','contact'].map(s=>`<div class="panel sec">${contentForm(s)}</div>`).join('')}`;
  if(adminTab==='seguranca')main=`<h2>Segurança e dados</h2><div class="panel sec"><form data-form="security"><h3>Acesso do dono</h3><label for="se">E-mail do dono</label><input id="se" name="email" type="email" value="${esc(S.admin.email)}" required>
  <label for="sn">Nova senha (deixe em branco para manter)</label><input id="sn" name="np" type="password" autocomplete="new-password"><label for="sc">Senha atual (obrigatória)</label><input id="sc" name="cur" type="password" autocomplete="current-password" required>
  <div class="err" role="alert"></div><button class="btn" style="margin-top:.8rem">Salvar acesso</button></form></div>
  <div class="panel sec"><h3>Backup dos dados</h3><p class="hint" style="margin-bottom:.8rem">Os dados ficam salvos neste navegador. Exporte um backup de tempos em tempos.</p><button class="btn ghost" data-act="exportData">Exportar backup (.json)</button></div>`;
  $('#admin').innerHTML=`<aside><button class="logo" data-act="closeAdmin"><b>&lt;/&gt;</b>Painel</button>${tabs.map(t=>`<button class="t ${adminTab===t[0]?'on':''}" data-act="adminTab" data-t="${t[0]}">${ico(t[1])}${t[2]}</button>`).join('')}<button class="t" data-act="closeAdmin" style="margin-top:auto">${ico('back')} Voltar ao site</button></aside><main>${main}</main>`;
}
function adminLoginModal(){
  openModal(`<h2>Área do dono</h2><p class="sub">Acesso restrito. Contas de visitantes não entram aqui.</p>
  <form data-form="adminlogin"><label for="ae">E-mail do dono</label><input id="ae" name="email" type="email" autocomplete="username" required>
  <label for="ap">Senha</label><input id="ap" name="pass" type="password" autocomplete="current-password" required>
  <div class="err" role="alert"></div><button class="btn" style="width:100%">Entrar como dono</button></form>`);
}

/* ================= AÇÕES ================= */
const act={
  toTop(){scrollTo({top:0,behavior:'smooth'})},
  tab(d){tab=d.tab;renderHub(true);},
  goTab(d){tab=d.tab;renderHub(true);$('#hub').scrollIntoView({behavior:'smooth'})},
  filter(d){filter=d.f;renderHub(true)},
  openProject(d){showProject(d.id)},
  vote(d){
    const u=me();if(!u){return openAuth('Entre com o Google para dar Gostei ou Não gostei.')}
    const v=+d.v;S.votes[curPid]=S.votes[curPid]||{};
    if(S.votes[curPid][u.id]===v)delete S.votes[curPid][u.id];else S.votes[curPid][u.id]=v;
    save();refreshProject();
  },
  auth(){openAuth()},
  async googleLogin(){
    try {
      const { error } = await _supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: 'https://mydevhub.club' }
      });
      if(error) toast('Erro ao entrar com Google: ' + error.message, true);
    } catch(err){
      toast('Erro de conexão com o Supabase', true);
    }
  },
  async logout(){
    if(supabaseUser){
      await _supabase.auth.signOut();
      supabaseUser=null;
    }
    adminOn=false;save();closeAdminQuiet();renderAll(true);toast('Você saiu da conta.');
  },
  adminLogin(){if(adminOn)openAdmin();else adminLoginModal()},
  openAdmin(){openAdmin()},closeAdmin(){closeAdmin()},closeModal(){closeModal()},
  adminTab(d){adminTab=d.t;renderAdmin()},
  newProject(){openModal(projectForm())},
  editProject(d){openModal(projectForm(S.projects.find(p=>p.id===d.id)))},
  delProject(d){
    const p=S.projects.find(x=>x.id===d.id);if(!p||!confirm(`Excluir "${p.title}"? Reações e comentários dele também serão apagados.`))return;
    S.projects=S.projects.filter(x=>x.id!==d.id);delete S.votes[d.id];S.comments=S.comments.filter(c=>c.pid!==d.id);save();toast('Projeto excluído.');afterAdminChange();
  },
  delComment(d){if(!adminOn||!confirm('Excluir este comentário?'))return;S.comments=S.comments.filter(c=>c.id!==d.id);save();if($('#admin').classList.contains('open'))renderAdmin();refreshProject()},
  editContent(d){openModal(contentForm(d.sec))},
  exportData(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='my-dev-hub-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
};
function closeAdminQuiet(){$('#admin').classList.remove('open');document.body.style.overflow=''}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;if(act[t.dataset.act]){e.stopPropagation();act[t.dataset.act](t.dataset,t,e)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('article.card')){e.preventDefault();act.openProject(e.target.dataset)}});

/* ================= INÍCIO ================= */
loadState().then(async()=>{
  await initSupabaseAuth();
  renderAll(false);
  updateScroll(true);
  watchReveals();
});
</script>
</body>
</html>
