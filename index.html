<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Dev Hub - Ideias que viram códigos</title>
<meta name="description" content="My Dev Hub: o depósito de links de projetos, sites e ideias de João Pedro Félix.">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#000;--panel:#050912;--panel2:#091020;--line:#13233f;--blue:#1646ff;--blue2:#0a2a9e;--neon:#1ad1ff;--white:#f4f8ff;--mut:#8da2c8;--ok:#2be6a0;--bad:#ff5d7a;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--white);font:400 1rem/1.6 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
h1,h2,h3,.disp{font-family:Unbounded,"Segoe UI",system-ui,sans-serif;line-height:1.1;font-weight:700}
button{font:inherit;color:inherit}
a{color:var(--neon)}
:focus-visible{outline:2px solid var(--neon);outline-offset:3px;border-radius:6px}
svg.i{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--blue),var(--neon));box-shadow:0 0 14px var(--neon);z-index:300}
nav.top{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:1.2rem;padding:.8rem clamp(1rem,4vw,2.5rem);background:rgba(0,0,0,.55);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s,background .3s}
nav.top.solid{border-color:var(--line);background:rgba(0,0,0,.82)}
.logo{font:800 1.05rem Unbounded,system-ui,sans-serif;text-decoration:none;color:var(--white);white-space:nowrap;display:flex;align-items:center;gap:.5rem;background:none;border:0;cursor:pointer}
.logo b{display:inline-grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:8px;background:var(--blue);box-shadow:0 0 16px rgba(26,209,255,.6);font-size:.8rem}
.links{display:flex;gap:.2rem;margin-left:auto}
.links button{background:none;border:0;padding:.45rem .8rem;border-radius:8px;color:var(--mut);cursor:pointer;font-weight:700;font-size:.92rem;transition:color .2s,background .2s}
.links button:hover,.links button.on{color:var(--white);background:rgba(26,209,255,.1)}
.links button.on{box-shadow:inset 0 -2px 0 var(--neon)}
.acts{display:flex;gap:.5rem;align-items:center}
@media(max-width:860px){.links{display:none}.acts{margin-left:auto}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.7rem 1.2rem;border-radius:10px;border:1px solid var(--neon);background:var(--neon);color:#001018;font-weight:800;font-size:.95rem;cursor:pointer;text-decoration:none;transition:box-shadow .2s,transform .2s,background .2s}
.btn:hover{box-shadow:0 0 0 3px rgba(26,209,255,.2),0 0 26px rgba(26,209,255,.6);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--white);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--neon);box-shadow:0 0 18px rgba(26,209,255,.25)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{background:transparent;color:var(--bad);border-color:rgba(255,93,122,.4)}
.btn.danger:hover{box-shadow:0 0 18px rgba(255,93,122,.3);border-color:var(--bad)}
.btn.kill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.kill:hover{box-shadow:0 0 18px rgba(255,93,122,.45)}
.btn.sm{padding:.42rem .8rem;font-size:.82rem;border-radius:8px}
.btn[disabled]{opacity:.5;pointer-events:none}
label{display:block;font-size:.85rem;font-weight:700;color:var(--mut);margin:.9rem 0 .3rem}
input,textarea,select{width:100%;background:#02050c;border:1px solid var(--line);color:var(--white);border-radius:10px;padding:.7rem .85rem;font:inherit;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--neon);box-shadow:0 0 0 3px rgba(26,209,255,.18)}
textarea{min-height:110px;resize:vertical}
.err{color:var(--bad);font-size:.88rem;min-height:1.2em;margin-top:.6rem}
.hint{color:var(--mut);font-size:.85rem}
.hero{position:relative;min-height:100vh;display:grid;place-items:center;text-align:center;padding:7rem 1.2rem 5rem;overflow:hidden}
.grid-bg{position:absolute;inset:-25% -10% 0;background-image:linear-gradient(rgba(26,209,255,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(26,209,255,.13) 1px,transparent 1px);background-size:58px 58px;-webkit-mask-image:radial-gradient(ellipse at 50% 42%,#000 15%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 42%,#000 15%,transparent 70%);will-change:transform}
.glow{position:absolute;width:62vmax;height:62vmax;left:50%;top:38%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(22,70,255,.38),transparent 60%);filter:blur(24px);animation:breathe 7s ease-in-out infinite}
@keyframes breathe{50%{opacity:.6;transform:translate(-50%,-50%) scale(1.08)}}
.hero-in{position:relative;max-width:980px;will-change:transform,opacity}
.hello{display:inline-block;border:1px solid var(--line);background:rgba(5,9,18,.7);padding:.55rem 1.1rem;border-radius:999px;font-size:.95rem;color:var(--mut);animation:rise .9s .1s both}
.hello b{color:var(--white)}
.hero h1{font-weight:800;font-size:clamp(2.6rem,9.5vw,7.4rem);letter-spacing:-.03em;margin:1.4rem 0 .9rem;text-shadow:0 0 34px rgba(26,209,255,.55),0 0 90px rgba(22,70,255,.5);animation:rise 1s .25s both}
.tagline{font:500 clamp(1.1rem,2.6vw,1.7rem) Unbounded,system-ui,sans-serif;color:var(--neon);animation:rise 1s .4s both}
.intro{max-width:560px;margin:1.3rem auto 0;color:var(--mut);animation:rise 1s .55s both}
.cta{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;margin-top:2rem;animation:rise 1s .7s both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.cue{position:absolute;bottom:1.6rem;left:50%;transform:translateX(-50%);color:var(--mut);font-size:.8rem;display:grid;gap:.5rem;justify-items:center}
.cue i{width:22px;height:36px;border:2px solid var(--mut);border-radius:12px;position:relative}
.cue i::after{content:"";position:absolute;left:50%;top:6px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--neon);animation:wheel 1.6s infinite}
@keyframes wheel{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(14px)}}
.loading{color:var(--mut);font-weight:700;letter-spacing:.05em;animation:breathe2 1.4s ease-in-out infinite}
@keyframes breathe2{50%{opacity:.4}}
.scrub{height:280vh;position:relative}
.stage{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;justify-content:center;padding:5rem clamp(1rem,5vw,4rem) 2rem;max-width:1200px;margin:auto}
.stage h2{font-size:clamp(1.5rem,4vw,2.6rem);margin-bottom:.5rem}
.stage>p{color:var(--mut);margin-bottom:2rem;max-width:520px}
.duo{display:grid;grid-template-columns:minmax(0,.8fr) 70px minmax(0,1.3fr);align-items:center;gap:0}
.idea{--p:0;background:var(--panel);border:1px solid rgba(26,209,255,calc(.15 + var(--p)*.7));border-radius:var(--r);padding:1.5rem;box-shadow:0 0 calc(var(--p)*40px) rgba(26,209,255,.28);transform:translateX(calc(var(--p)*-10px)) scale(calc(1 - var(--p)*.05));transition:box-shadow .2s}
.idea small{color:var(--neon);font-weight:800}
.idea p{font:600 1.15rem/1.4 Unbounded,system-ui,sans-serif;margin-top:.6rem}
.wire{height:3px;background:var(--line);position:relative;overflow:hidden;border-radius:3px;margin:0 6px}
.wire i{position:absolute;inset:0;background:var(--neon);box-shadow:0 0 12px var(--neon);transform-origin:left;transform:scaleX(var(--p,0))}
.win{background:#02050d;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 20px 70px rgba(22,70,255,.22)}
.win header{display:flex;align-items:center;gap:.4rem;padding:.7rem 1rem;border-bottom:1px solid var(--line);background:var(--panel2);font-size:.8rem;color:var(--mut)}
.win header span{width:10px;height:10px;border-radius:50%;background:#1b2b4d}
.win header em{margin-left:.6rem;font-style:normal}
.win pre{padding:1.2rem 1.3rem;min-height:15.5rem;font:500 clamp(.78rem,1.6vw,.95rem)/1.7 "JetBrains Mono",ui-monospace,Consolas,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:#cfe0ff}
.s{color:#7fe3ff}.k{color:#5b8cff}.n{color:#ffd37a}.c{color:#5c7099}
.caret{display:inline-block;width:.55ch;height:1.1em;background:var(--neon);vertical-align:-.2em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pub{display:inline-flex;align-items:center;gap:.5rem;margin-top:1.2rem;padding:.5rem 1rem;border-radius:999px;border:1px solid rgba(43,230,160,.5);color:var(--ok);font-weight:800;opacity:0;transform:translateY(10px);transition:.4s}
.pub.on{opacity:1;transform:none;box-shadow:0 0 22px rgba(43,230,160,.3)}
@media(max-width:820px){.duo{grid-template-columns:1fr}.wire{width:3px;height:36px;margin:6px auto}.wire i{transform-origin:top;transform:scaleY(var(--p,0))}.scrub{height:240vh}}
.hub{max-width:1180px;margin:0 auto;padding:4rem clamp(1rem,4vw,2rem) 6rem;scroll-margin-top:60px}
.tabbar{position:sticky;top:58px;z-index:50;display:flex;gap:.4rem;padding:.5rem;margin:0 auto 2.4rem;width:max-content;max-width:100%;background:rgba(5,9,18,.85);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
.tabbar button{background:none;border:0;padding:.65rem 1.3rem;border-radius:10px;color:var(--mut);font-weight:800;cursor:pointer;white-space:nowrap;transition:.2s}
.tabbar button:hover{color:var(--white)}
.tabbar button.on{background:var(--blue);color:#fff;box-shadow:0 0 22px rgba(22,70,255,.7)}
.phead{display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap;margin-bottom:1.4rem}
.phead h2{font-size:clamp(1.5rem,3.4vw,2.3rem)}
.phead p{color:var(--mut);margin-top:.4rem}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.6rem}
.chip{border:1px solid var(--line);background:transparent;padding:.4rem .9rem;border-radius:999px;color:var(--mut);cursor:pointer;font-weight:700;font-size:.85rem;transition:.2s}
.chip:hover{border-color:var(--neon);color:var(--white)}
.chip.on{background:rgba(26,209,255,.14);border-color:var(--neon);color:var(--neon)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.2rem}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1.3rem;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;gap:.7rem;transition:border-color .25s,transform .25s}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(26,209,255,.16),transparent 60%);opacity:0;transition:opacity .25s;pointer-events:none}
.card:hover{border-color:rgba(26,209,255,.6);transform:translateY(-4px)}
.card:hover::before{opacity:1}
.card h3{font-size:1.1rem;line-height:1.25}
.card p{color:var(--mut);font-size:.93rem;flex:1}
.tg{align-self:flex-start;font-size:.75rem;font-weight:800;padding:.2rem .65rem;border-radius:999px;border:1px solid}
.t-Projeto{color:var(--neon);border-color:rgba(26,209,255,.5);background:rgba(26,209,255,.08)}
.t-Site{color:#7da2ff;border-color:rgba(125,162,255,.5);background:rgba(22,70,255,.12)}
.t-Ideia{color:#fff;border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.06)}
.foot{display:flex;gap:1rem;align-items:center;color:var(--mut);font-size:.85rem;flex-wrap:wrap}
.foot span{display:inline-flex;align-items:center;gap:.35rem}
.foot .host{margin-left:auto;color:var(--mut)}
.cadm{display:flex;gap:.4rem;position:absolute;top:.8rem;right:.8rem;z-index:2}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:2.4rem;text-align:center;color:var(--mut)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:clamp(1.2rem,3vw,2rem)}
.hist{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1.4rem}
.hist .txt p{margin-bottom:1rem;color:#c6d4ee;max-width:68ch}
.who dl{display:grid;gap:.9rem;margin-top:1rem}
.who dt{color:var(--mut);font-size:.82rem;font-weight:700}
.who dd{font-weight:700;font-size:1.05rem}
.ctl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.4rem}
.wa{display:flex;align-items:center;gap:1rem;padding:1.2rem;border-radius:var(--r);border:1px solid rgba(26,209,255,.4);background:linear-gradient(135deg,rgba(22,70,255,.25),rgba(26,209,255,.06));text-decoration:none;color:var(--white);transition:.25s}
.wa:hover{box-shadow:0 0 36px rgba(26,209,255,.35);transform:translateY(-2px)}
.wa strong{font-size:1.2rem;display:block}
.cl{display:grid;gap:.6rem;margin-top:1rem}
.cl a{display:flex;gap:.6rem;align-items:center;padding:.75rem 1rem;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--white);transition:.2s}
.cl a:hover{border-color:var(--neon)}
@media(max-width:820px){.hist,.ctl{grid-template-columns:1fr}}
footer{border-top:1px solid var(--line);padding:2rem clamp(1rem,4vw,2.5rem);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;color:var(--mut);font-size:.9rem}
footer button{background:none;border:0;color:var(--mut);cursor:pointer;display:inline-flex;gap:.4rem;align-items:center}
footer button:hover{color:var(--neon)}
.rv{opacity:0;transform:translateY(34px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.l{transform:translateX(-40px)}.rv.r{transform:translateX(40px)}
.rv.in{opacity:1;transform:none}
#top{position:fixed;right:1.2rem;bottom:1.2rem;z-index:90;width:46px;height:46px;border-radius:50%;border:1px solid var(--neon);background:rgba(0,0,0,.8);color:var(--neon);cursor:pointer;display:grid;place-items:center;opacity:0;pointer-events:none;transform:translateY(12px);transition:.3s;box-shadow:0 0 18px rgba(26,209,255,.35)}
#top.on{opacity:1;pointer-events:auto;transform:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.74);backdrop-filter:blur(6px);display:none;z-index:200;overflow:auto;padding:5vh 1rem}
.ov.open{display:block}
.md{max-width:640px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:1.6rem;position:relative;box-shadow:0 0 70px rgba(22,70,255,.28);animation:pop .28s cubic-bezier(.2,.8,.2,1)}
.md.wide{max-width:760px}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.x{position:absolute;top:1rem;right:1rem;background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--mut)}
.x:hover{color:var(--neon);border-color:var(--neon)}
.md h2{font-size:1.35rem;margin-bottom:.3rem;padding-right:2.5rem}
.md>.sub{color:var(--mut);margin-bottom:.5rem}
.seg{display:flex;gap:.3rem;background:#02050c;border:1px solid var(--line);padding:.3rem;border-radius:12px;margin:1rem 0 .4rem}
.seg button{flex:1;background:none;border:0;padding:.55rem;border-radius:9px;color:var(--mut);font-weight:800;cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
.note{border:1px dashed rgba(26,209,255,.5);background:rgba(26,209,255,.06);border-radius:12px;padding:.9rem 1rem;margin:1rem 0;font-size:.88rem;color:var(--mut)}
.react{display:flex;gap:.6rem;margin:1.1rem 0;flex-wrap:wrap}
.rb{display:inline-flex;gap:.5rem;align-items:center;padding:.6rem 1.1rem;border-radius:12px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:800;transition:.2s}
.rb:hover{border-color:var(--neon)}
.rb.up.on{background:rgba(43,230,160,.14);border-color:var(--ok);color:var(--ok)}
.rb.dn.on{background:rgba(255,93,122,.14);border-color:var(--bad);color:var(--bad)}
.cm{border-top:1px solid var(--line);margin-top:1.2rem;padding-top:1rem}
.cm h3{font-size:1rem;margin-bottom:.8rem}
.cmi{border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;margin-bottom:.6rem;background:var(--panel2)}
.cmi header{display:flex;justify-content:space-between;gap:.5rem;font-size:.82rem;color:var(--mut);margin-bottom:.2rem}
.cmi header b{color:var(--white)}
.cmi p{overflow-wrap:anywhere}
.cmi{display:flex;gap:.8rem;align-items:flex-start}
.cmb{flex:1;min-width:0}
.avw{position:relative;flex:none;display:inline-block;width:var(--s);height:var(--s);border-radius:50%}
.avw .av{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;border:1px solid rgba(26,209,255,.45)}
.avw span.av{display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font:800 calc(var(--s)*.38) Unbounded,sans-serif;letter-spacing:.02em}
.nameav{display:inline-flex;align-items:center;gap:.55rem}
.lock{border:1px dashed var(--line);border-radius:12px;padding:1rem;text-align:center;color:var(--mut)}
.lock .btn{margin-top:.7rem}
.gbtn{width:100%;margin-bottom:1rem}
.or{text-align:center;color:var(--mut);font-size:.85rem;margin-bottom:.4rem}
.admin{position:fixed;inset:0;z-index:150;background:var(--bg);display:none;grid-template-columns:230px minmax(0,1fr);overflow:hidden}
.admin.open{display:grid}
.admin aside{border-right:1px solid var(--line);padding:1.2rem .8rem;display:flex;flex-direction:column;gap:.3rem;background:var(--panel);overflow:auto}
.admin aside .logo{margin-bottom:1rem;padding:0 .4rem}
.admin aside button.t{background:none;border:0;text-align:left;padding:.65rem .8rem;border-radius:10px;color:var(--mut);cursor:pointer;font-weight:700;display:flex;gap:.6rem;align-items:center}
.admin aside button.t:hover{color:var(--white);background:rgba(26,209,255,.08)}
.admin aside button.t.on{background:var(--blue);color:#fff}
.admin main{overflow:auto;padding:clamp(1rem,3vw,2.2rem)}
.admin main h2{font-size:1.6rem;margin-bottom:1.2rem}
.who-bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.4rem;color:var(--mut);font-size:.88rem}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1rem}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem}
.stat b{display:block;font:800 2rem Unbounded,sans-serif;color:var(--neon)}
.stat span{color:var(--mut);font-size:.85rem}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:.75rem 1rem;border-bottom:1px solid var(--line);font-size:.92rem;vertical-align:middle}
th{color:var(--mut);font-size:.8rem;background:var(--panel)}
tr:last-child td{border-bottom:0}
td .row{display:flex;gap:.4rem;flex-wrap:wrap}
.ok{color:var(--ok);font-weight:800}.pend{color:#ffd37a;font-weight:800}.ban{color:var(--bad);font-weight:800}
.bar2{display:flex;height:8px;border-radius:6px;overflow:hidden;background:var(--line);margin:.5rem 0}
.bar2 i{display:block;height:100%}
.rx{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem;margin-bottom:1rem}
.rx small{color:var(--mut);display:block}
.sec{margin-bottom:1.4rem}
.sec h3{font-size:1.05rem;margin-bottom:.4rem}
#toast{position:fixed;left:50%;bottom:1.5rem;transform:translate(-50%,30px);background:var(--panel2);border:1px solid var(--neon);padding:.7rem 1.2rem;border-radius:12px;z-index:400;opacity:0;pointer-events:none;transition:.3s;box-shadow:0 0 28px rgba(26,209,255,.3);max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{border-color:var(--bad)}
@media(max-width:820px){.admin.open{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.admin aside{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:.6rem}.admin aside .logo{display:none}.admin aside button.t{white-space:nowrap}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="bar"></div>
<nav class="top" id="nav"></nav>

const GOOGLE_SVG='<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.95H1.19v3.15C3.17 21.31 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.25c-.25-.72-.38-1.49-.38-2.25s.13-1.53.38-2.25V6.6H1.19C.43 8.13 0 9.87 0 12s.43 3.87 1.19 5.4l4.09-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.69 1.19 6.6l4.09 3.15c.95-2.84 3.6-4.95 6.72-4.95z"/></svg>';
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';
function avatar(name,url,s){
  s=s||34;
  const img=(url&&/^https:\/\//i.test(url))?`<img class="av" src="${esc(url)}" alt="" referrerpolicy="no-referrer" loading="lazy" onerror="this.remove()">`:'';
  return `<span class="avw" style="--s:${s}px" aria-hidden="true"><span class="av">${esc(initials(name))}</span>${img}</span>`;
}
const fixUrl=u=>{u=String(u||'').trim();return /^https?:\/\//i.test(u)?u:'https://'+u};
const host=u=>{try{return new URL(fixUrl(u)).hostname.replace(/^www\./,'')}catch(e){return ''}};
let toastT;function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='on'+(bad?' bad':'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='',3600)}
function busy(f,on){const b=f.querySelector('button:not([type=button])');if(b)b.disabled=on}
const ss={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}},del:k=>{try{sessionStorage.removeItem(k)}catch(e){}}};
function mergeContent(d){
  d=d||{};const c=clone(DEFAULT_CONTENT);
  return{hero:{...c.hero,...(d.hero||{})},history:(typeof d.history==='string'&&d.history.trim())?d.history:c.history,contact:{...c.contact,...(d.contact||{})}};
}

/* ================= ESTADO ================= */
let D={content:clone(DEFAULT_CONTENT),projects:[],comments:[],votes:[],profiles:[]};
let user=null,profile=null,isAdmin=false,lastUid=null,wantAdmin=false,quietOut=false,voting=false;
let tab='projetos',filter='Todos',adminTab='resumo',curPid=null,afterAuth=null;

async function loadData(){
  const [c,p,cm,v]=await Promise.all([
    sb.from('site_content').select('data').eq('id',1).maybeSingle(),
    sb.from('projects').select('*').order('created_at',{ascending:false}),
    sb.from('comments').select('*').order('created_at',{ascending:false}),
    sb.from('votes').select('project_id,user_id,value')
  ]);
  const e=c.error||p.error||cm.error||v.error;
  if(e){console.error(e);toast('Erro ao carregar dados do Supabase. Confira se o supabase-setup.sql foi executado.',true)}
  if(!c.error)D.content=mergeContent(c.data&&c.data.data);
  if(!p.error)D.projects=p.data||[];
  if(!cm.error)D.comments=cm.data||[];
  if(!v.error)D.votes=v.data||[];
  D.profiles=[];
  if(isAdmin){
    const r=await sb.from('profiles').select('*').order('created_at',{ascending:false});
    if(r.error)console.error(r.error);else D.profiles=r.data||[];
  }
}
async function applySession(session){
  user=session&&session.user||null;profile=null;isAdmin=false;
  if(user){
    const [pr,ad]=await Promise.all([
      sb.from('profiles').select('*').eq('id',user.id).maybeSingle(),
      sb.from('admins').select('user_id').eq('user_id',user.id).maybeSingle()
    ]);
    profile=pr.data||null;isAdmin=!!ad.data;
  }
}
const me=()=>{
  if(!user)return null;
  const md=user.user_metadata||{};
  return{id:user.id,email:user.email,banned:!!(profile&&profile.banned),avatar:(profile&&profile.avatar_url)||md.avatar_url||md.picture||'',name:(profile&&profile.name)||md.full_name||md.name||(user.email||'').split('@')[0]||'Visitante'};
};
const votesOf=pid=>{const vs=D.votes.filter(v=>v.project_id===pid);return{up:vs.filter(v=>v.value===1).length,dn:vs.filter(v=>v.value===-1).length}};
const myVote=pid=>{const u=me();if(!u)return 0;const v=D.votes.find(x=>x.project_id===pid&&x.user_id===u.id);return v?v.value:0};
const cmOf=pid=>D.comments.filter(c=>c.project_id===pid);
const nameOf=id=>{const p=D.profiles.find(x=>x.id===id);return p?p.name:'(sem perfil)'};
const waLink=txt=>'https://wa.me/55'+String(D.content.contact.whatsapp).replace(/\D/g,'').replace(/^55(?=\d{11}$)/,'')+(txt?'?text='+encodeURIComponent(txt):'');
const adminOpen=()=>$('#admin').classList.contains('open');

/* ================= RENDER: PÁGINA PÚBLICA ================= */

  else if(u)acts=`<span class="hint nameav" style="margin-right:.2rem">${avatar(u.name,u.avatar,30)}Olá, ${esc(first(u.name))}</span><button class="btn ghost sm" data-act="logout">Sair</button>`;
  else acts=`<button class="btn ghost sm" data-act="auth" data-tab="login">Entrar</button><button class="btn sm" data-act="auth" data-tab="register">Cadastrar</button>`;

  <div class="acts">${acts}</div>`;

}

  const hub=$('#hub');if(!hub)return;

  ['projetos','historia','contato'].forEach(t=>{const b=$('#nl-'+t);if(b)b.classList.toggle('on',inHub&&tab===t)});

      <a class="btn ghost" href="${esc(waLink())}" target="_blank" rel="noopener">${ico('wa')} Chamar no WhatsApp</a>

let TOTAL=0,FULL='',lastN=-1;
function codeText(){
  const h=D.content.hero;
  return `const hub = {\n  site: "${h.site}",\n  lema: "${h.tagline}",\n  dono: "${h.name}",\n  idade: ${parseInt(h.age)||0},\n  cidade: "${h.city}",\n  projetos: ${D.projects.length},\n};\n\nhub.publicar(); // no ar`;
}

  return esc(src).replace(/(&quot;[^\n]*?(?:&quot;|$))|(\bconst\b)|(\b\d+\b)|(\/\/[^\n]*)/g,(m,a,b,c,d)=>a?`<span class="s">${a}</span>`:b?`<span class="k">${b}</span>`:c?`<span class="n">${c}</span>`:`<span class="c">${d}</span>`);

function renderHub(instant){

function panelProjects(instant){
  const list=D.projects.filter(p=>filter==='Todos'||p.tag===filter);
  const cards=list.map((p,i)=>{
    const v=votesOf(p.id);
    return `<article class="card rv${instant?' in':''}" style="--d:${instant?0:Math.min(i,6)*.07}s" tabindex="0" role="button" data-act="openProject" data-id="${p.id}" aria-label="Abrir ${esc(p.title)}">

      <h3>${esc(p.title)}</h3><p>${esc(p.description)}</p>
      <div class="foot"><span>${ico('up')}${v.up}</span><span>${ico('dn')}${v.dn}</span><span>${ico('msg')}${cmOf(p.id).length}</span><span class="host">${esc(host(p.url))}</span></div>
    </article>`}).join('');
  const empty=D.projects.length?`Nenhum item em "${esc(filter)}" por enquanto.`:(isAdmin?'Nenhum projeto ainda. Clique em "Novo projeto" para adicionar o primeiro.':'Os projetos vão aparecer aqui em breve.');

    ${list.length?`<div class="grid">${cards}</div>`:`<div class="empty">${empty}</div>`}`;
}
function panelHistory(){
  const h=D.content.hero,paras=D.content.history.split(/\n\s*\n/).map(p=>`<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join('');

}

function rerender(){renderAll(true);if(adminOpen())renderAdmin();refreshProject()}

/* ================= SCROLL ================= */
let ticking=false;
function updateScroll(force){
  const y=scrollY,H=innerHeight,max=document.documentElement.scrollHeight-H;
  $('#bar').style.width=(max>0?y/max*100:0)+'%';
  $('#nav').classList.toggle('solid',y>30);
  $('#top').classList.toggle('on',y>H*.8);
  const hp=clamp(y/H,0,1),hi=$('#heroin'),gb=$('#gridbg');
  if(hi&&!matchMedia('(prefers-reduced-motion:reduce)').matches){hi.style.transform=`translateY(${y*.32}px) scale(${1-hp*.1})`;hi.style.opacity=String(1-hp*1.15)}
  if(gb)gb.style.transform=`translateY(${y*.18}px)`;
  const sc=$('#scrub');
  if(sc&&sc.firstElementChild){
    const r=sc.getBoundingClientRect(),p=clamp(-r.top/(r.height-H),0,1);
    const idea=$('#idea');if(idea)idea.style.setProperty('--p',p.toFixed(3));
    const w=$('#wire');if(w)w.style.setProperty('--p',clamp(p*1.6,0,1).toFixed(3));
    const n=Math.round(clamp(p/.85,0,1)*TOTAL);
    if(n!==lastN||force){lastN=n;const pre=$('#code');if(pre)pre.innerHTML=hl(FULL.slice(0,n))+(n<TOTAL?'<i class="caret"></i>':'');}
    const pub=$('#pub');if(pub)pub.classList.toggle('on',p>.93);
  }
  markNav();ticking=false;
}

let io;
function watchReveals(){
  if(!('IntersectionObserver' in window)){document.querySelectorAll('.rv').forEach(e=>e.classList.add('in'));return}
  if(!io)io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12,rootMargin:'0px 0px -6% 0px'});
  document.querySelectorAll('.rv:not(.in)').forEach(e=>io.observe(e));
}

/* Mudanças de sessão (login, logout, retorno do Google ou do link de e-mail) */
async function syncSession(session,ev){
  await applySession(session);
  if(wantAdmin&&user&&!isAdmin){
    wantAdmin=false;ss.del('wantAdmin');quietOut=true;
    await sb.auth.signOut();
    toast('Esta conta não tem acesso de dono.',true);
    return;
  }
  await loadData();
  if(!isAdmin)closeAdminQuiet();
  const back=afterAuth;afterAuth=null;
  if(ev==='SIGNED_IN'&&$('#modal').classList.contains('open'))closeModal();
  rerender();
  if(wantAdmin&&isAdmin){wantAdmin=false;ss.del('wantAdmin');openAdmin();toast('Acesso do dono liberado.')}
  else if(ev==='SIGNED_IN'){const u=me();if(u)toast('Olá, '+first(u.name)+'!');if(back)showProject(back)}
  else if(ev==='SIGNED_OUT'){if(quietOut)quietOut=false;else toast('Você saiu da conta.')}
}

const forms={
  async login(f){
    busy(f,true);
    const email=f.email.value.trim().toLowerCase();
    const {error}=await sb.auth.signInWithPassword({email,password:f.pass.value});
    if(error){
      if(/confirm/i.test(error.message))return openConfirmSent(email);
      return err(f,'E-mail ou senha incorretos.');
    }
  },
  async register(f){
    const name=f.name.value.trim(),email=f.email.value.trim().toLowerCase(),p=f.pass.value;
    if(name.length<2)return err(f,'Informe seu nome.');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))return err(f,'Digite um e-mail válido.');
    if(p.length<6)return err(f,'A senha precisa ter pelo menos 6 caracteres.');
    if(p!==f.pass2.value)return err(f,'As senhas não são iguais.');
    busy(f,true);
    const {data,error}=await sb.auth.signUp({email,password:p,options:{data:{full_name:name},emailRedirectTo:SITE_URL}});
    if(error)return err(f,/registered|exists/i.test(error.message)?'Este e-mail já está cadastrado. Use a aba Entrar.':'Não foi possível criar a conta: '+error.message);
    if(data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0)return err(f,'Este e-mail já está cadastrado. Use a aba Entrar.');
    if(!data.session)openConfirmSent(email);
  },
  async adminlogin(f){
    busy(f,true);wantAdmin=true;
    const {error}=await sb.auth.signInWithPassword({email:f.email.value.trim().toLowerCase(),password:f.pass.value});
    if(error){wantAdmin=false;return err(f,/confirm/i.test(error.message)?'Confirme o e-mail desta conta antes de entrar.':'Acesso negado. E-mail ou senha incorretos.')}
  },
  async comment(f){
    const u=me();if(!u)return openAuth('login','Entre para comentar.');
    const t=f.t.value.trim();if(!t)return err(f,'Escreva algo antes de comentar.');
    busy(f,true);
    const {error}=await sb.from('comments').insert({project_id:curPid,user_id:u.id,text:t.slice(0,500)});
    if(error)return err(f,'Não foi possível comentar: '+error.message);
    await loadData();refreshProject();refreshHub();toast('Comentário publicado.');
  },
  wamsg(f){const n=f.n.value.trim(),m=f.m.value.trim();window.open(waLink(`Olá, sou ${n}. ${m}`),'_blank','noopener')},
  async project(f){
    const d={title:f.title.value.trim().slice(0,80),description:f.desc.value.trim().slice(0,300),url:fixUrl(f.url.value),tag:f.tag.value};
    if(!d.title||!f.url.value.trim())return err(f,'Preencha o título e o link.');
    busy(f,true);
    const id=f.dataset.id;
    const r=id?await sb.from('projects').update(d).eq('id',id).select():await sb.from('projects').insert(d).select();
    if(r.error)return err(f,'Erro ao salvar: '+r.error.message);
    if(!r.data||!r.data.length)return err(f,'Nada foi salvo: sua conta não tem permissão de dono no banco (tabela admins).');
    closeModal();await reload();toast(id?'Projeto atualizado.':'Projeto adicionado.');
  },
  async content(f){
    const sec=f.dataset.sec,next=clone(D.content);
    if(sec==='history')next.history=f.history.value;
    else for(const k of Object.keys(next[sec]))next[sec][k]=f[k].value.trim();
    busy(f,true);
    const r=await sb.from('site_content').upsert({id:1,data:next,updated_at:new Date().toISOString()}).select();
    if(r.error)return err(f,'Erro ao salvar: '+r.error.message);
    if(!r.data||!r.data.length)return err(f,'Nada foi salvo: sua conta não tem permissão de dono no banco (tabela admins).');
    D.content=next;busy(f,false);
    if($('#modal').classList.contains('open'))closeModal();
    rerender();toast('Alterações salvas. Já aparecem para todos.');
  },
  async security(f){
    const hasPass=(user.identities||[]).some(i=>i.provider==='email');
    const em=f.email.value.trim().toLowerCase(),np=f.np.value;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))return err(f,'E-mail inválido.');
    if(np&&np.length<8)return err(f,'A nova senha precisa ter 8 caracteres ou mais.');
    const upd={};
    if(em!==(user.email||'').toLowerCase())upd.email=em;
    if(np)upd.password=np;
    if(!Object.keys(upd).length)return err(f,'Nada para alterar.');
    busy(f,true);
    if(hasPass){
      const chk=await sb.auth.signInWithPassword({email:user.email,password:f.cur.value});
      if(chk.error)return err(f,'Senha atual incorreta.');
    }
    const {error}=await sb.auth.updateUser(upd,{emailRedirectTo:SITE_URL});
    if(error)return err(f,'Não foi possível salvar: '+error.message);
    f.reset();err(f,'');
    toast(upd.email?'Enviamos um link de confirmação para o novo e-mail.':'Senha atualizada.');
  }
};

});

    <div class="err" role="alert"></div><button class="btn" style="margin-top:.8rem">Salvar acesso</button></form></div>
    <div class="panel sec"><h3>Backup dos dados</h3><p class="hint" style="margin-bottom:.8rem">Os dados ficam no Supabase. Exporte um backup de tempos em tempos.</p><button class="btn ghost" data-act="exportData">Exportar backup (.json)</button></div>
    <div class="panel sec"><h3>Trazer dados da versão antiga</h3><p class="hint" style="margin-bottom:.8rem">A versão anterior salvava projetos e textos só neste navegador. Use uma vez para enviar esses dados ao banco (os cards "Exemplo:" são ignorados).</p><button class="btn ghost" data-act="importLocal">Importar dados deste navegador</button></div>`;
  }
  $('#admin').innerHTML=`<aside><button class="logo" data-act="closeAdmin"><b>&lt;/&gt;</b>Painel</button>${tabs.map(t=>`<button class="t ${adminTab===t[0]?'on':''}" data-act="adminTab" data-t="${t[0]}">${ico(t[1])}${t[2]}</button>`).join('')}<button class="t" data-act="closeAdmin" style="margin-top:auto">${ico('back')} Voltar ao site</button></aside>
  <main><div class="who-bar"><span>Conectado como <b>${esc(user.email)}</b></span><button class="btn ghost sm" data-act="refresh">Atualizar dados</button></div>${main}</main>`;
}

/* ================= AÇÕES (delegação de cliques) ================= */
const act={
  toTop(){scrollTo({top:0,behavior:'smooth'})},
  tab(d){tab=d.tab;renderHub(true)},
  goTab(d){tab=d.tab;renderHub(true);$('#hub').scrollIntoView({behavior:'smooth'})},
  filter(d){filter=d.f;renderHub(true)},
  openProject(d){showProject(d.id)},
  async vote(d){
    const u=me();if(!u)return openAuth('login','Entre na sua conta para dar Gostei ou Não gostei.');
    if(u.banned)return toast('Sua conta está bloqueada para reagir.',true);
    if(voting)return;voting=true;
    try{
      const v=+d.v,pid=curPid;
      const q=myVote(pid)===v
        ?sb.from('votes').delete().eq('project_id',pid).eq('user_id',u.id)
        :sb.from('votes').upsert({project_id:pid,user_id:u.id,value:v},{onConflict:'project_id,user_id'});
      const {error}=await q;
      if(error)return toast('Não foi possível registrar: '+error.message,true);
      await loadData();refreshProject();refreshHub();
    }finally{voting=false}
  },
  auth(d){openAuth(d.tab)},
  async googleLogin(d){
    if(d.admin){wantAdmin=true;ss.set('wantAdmin','1')}
    const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:SITE_URL}});
    if(error){wantAdmin=false;ss.del('wantAdmin');toast('Erro ao entrar com Google: '+error.message,true)}
  },
  async resendSignup(d){
    const {error}=await sb.auth.resend({type:'signup',email:d.email,options:{emailRedirectTo:SITE_URL}});
    toast(error?'Não foi possível reenviar: '+error.message:'E-mail reenviado.',!!error);
  },
  async logout(){closeAdminQuiet();await sb.auth.signOut()},
  adminLogin(){if(isAdmin)openAdmin();else adminLoginModal()},
  openAdmin(){openAdmin()},closeAdmin(){closeAdmin()},closeModal(){closeModal()},
  adminTab(d){adminTab=d.t;renderAdmin()},
  async refresh(){await reload();toast('Dados atualizados.')},
  newProject(){openModal(projectForm())},
  editProject(d){openModal(projectForm(D.projects.find(p=>p.id===d.id)))},
  async delProject(d){
    const p=D.projects.find(x=>x.id===d.id);if(!p||!confirm(`Excluir "${p.title}"? Reações e comentários dele também serão apagados.`))return;
    const r=await sb.from('projects').delete().eq('id',d.id).select();
    if(r.error||!r.data||!r.data.length)return toast('Não foi possível excluir'+(r.error?': '+r.error.message:' (sem permissão de dono).'),true);
    if(curPid===d.id)closeModal();
    await reload();toast('Projeto excluído.');
  },
  async delComment(d){
    if(!confirm('Excluir este comentário?'))return;
    const r=await sb.from('comments').delete().eq('id',d.id).select();
    if(r.error||!r.data||!r.data.length)return toast('Não foi possível excluir o comentário.',true);
    await loadData();if(adminOpen())renderAdmin();refreshProject();refreshHub();toast('Comentário excluído.');
  },
  async toggleBan(d){
    const u=D.profiles.find(x=>x.id===d.id);if(!u)return;
    const r=await sb.from('profiles').update({banned:!u.banned}).eq('id',u.id).select();
    if(r.error||!r.data||!r.data.length)return toast('Não foi possível alterar o usuário.',true);
    await reload();toast(u.banned?'Usuário desbloqueado.':'Usuário bloqueado.');
  },
  async wipeUser(d){
    const u=D.profiles.find(x=>x.id===d.id);if(!u||!confirm(`Apagar todos os comentários e reações de ${u.name}?`))return;
    const [a,b]=await Promise.all([sb.from('comments').delete().eq('user_id',u.id),sb.from('votes').delete().eq('user_id',u.id)]);
    if(a.error||b.error)return toast('Erro ao apagar: '+(a.error||b.error).message,true);
    await reload();toast('Atividade apagada.');
  },
  async deleteUser(d){
    const u=D.profiles.find(x=>x.id===d.id);if(!u)return;
    if(!confirm(`Excluir a conta de ${u.name} (${u.email})?\n\nIsso apaga o login, o perfil, os comentários e as reações dessa pessoa. Não dá para desfazer.`))return;
    const {error}=await sb.rpc('admin_delete_user',{target:u.id});
    if(error){
      if(/admin_delete_user|function/i.test(error.message)&&/not find|does not exist|schema cache/i.test(error.message))return toast('Falta rodar o supabase-excluir-usuario.sql no Supabase.',true);
      return toast('Não foi possível excluir: '+error.message,true);
    }
    await reload();toast('Usuário excluído.');
  },
  editContent(d){openModal(contentForm(d.sec))},
  exportData(){
    const b=new Blob([JSON.stringify({exportado_em:new Date().toISOString(),...D},null,2)],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='my-dev-hub-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  },
  async importLocal(){
    let raw=null;try{raw=localStorage.getItem(OLD_LOCAL_KEY)}catch(e){}
    if(!raw)return toast('Nenhum dado da versão antiga neste navegador.',true);
    let old;try{old=JSON.parse(raw)}catch(e){return toast('Dados antigos inválidos.',true)}
    const ps=(old.projects||[]).filter(p=>p&&p.title&&!/^Exemplo:/i.test(p.title)).map(p=>({
      title:String(p.title).slice(0,80),description:String(p.desc||'').slice(0,300),url:fixUrl(p.url),
      tag:TAGS.includes(p.tag)?p.tag:'Projeto',created_at:new Date(p.ts||Date.now()).toISOString()
    }));
    if(!confirm(`Importar ${ps.length} projeto(s) e os textos da página salvos neste navegador?\n\nUse só uma vez para não duplicar projetos.`))return;
    if(ps.length){const r=await sb.from('projects').insert(ps).select();if(r.error)return toast('Erro ao importar projetos: '+r.error.message,true)}
    if(old.content){const r=await sb.from('site_content').upsert({id:1,data:mergeContent(old.content),updated_at:new Date().toISOString()});if(r.error)return toast('Erro ao importar textos: '+r.error.message,true)}
    await reload();toast('Importação concluída.');
  }
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||!act[t.dataset.act])return;
  e.stopPropagation();
  Promise.resolve().then(()=>act[t.dataset.act](t.dataset,t,e)).catch(x=>{console.error(x);toast('Erro: '+(x&&x.message||x),true)});
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('article.card')){e.preventDefault();act.openProject(e.target.dataset)}});

/* ================= TEMPO REAL =================
   Quando o dono salva um projeto ou texto, quem está com o site aberto
   vê a mudança na hora, sem recarregar. */
let rtTimer=null;
function typing(){
  const a=document.activeElement;
  if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return true;
  return [...document.querySelectorAll('#mbody textarea,#mbody input')].some(x=>x.value.trim());
}
async function liveUpdate(){
  const before=JSON.stringify(D.content);
  await loadData();
  if(adminOpen()){renderAdmin();return}
  if(typing())return refreshHub();
  if(JSON.stringify(D.content)!==before){renderNav();renderHero();renderScrub();renderFooter();updateScroll(true)}
  else{FULL=codeText();TOTAL=FULL.length;updateScroll(true)}
  refreshHub();refreshProject();
}
function startRealtime(){
  try{
    sb.channel('mydevhub-live')
      .on('postgres_changes',{event:'*',schema:'public',table:'projects'},queue)
      .on('postgres_changes',{event:'*',schema:'public',table:'site_content'},queue)
      .on('postgres_changes',{event:'*',schema:'public',table:'comments'},queue)
      .on('postgres_changes',{event:'*',schema:'public',table:'votes'},queue)
      .subscribe();
  }catch(e){console.error(e)}
  function queue(){clearTimeout(rtTimer);rtTimer=setTimeout(()=>liveUpdate().catch(x=>console.error(x)),400)}
  // reserva: ao voltar para a aba, busca as novidades
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')queue()});
}

/* ================= INÍCIO ================= */
(async()=>{
  let session=null;
  try{session=(await sb.auth.getSession()).data.session}catch(e){console.error(e)}
  lastUid=session&&session.user?session.user.id:null;
  if(ss.get('wantAdmin')&&session)wantAdmin=true;else ss.del('wantAdmin');
  await applySession(session);
  if(wantAdmin&&!isAdmin){wantAdmin=false;ss.del('wantAdmin');quietOut=true;await sb.auth.signOut();user=null;profile=null;lastUid=null;toast('Esta conta não tem acesso de dono.',true)}
  await loadData();
  renderAll(false);watchReveals();
  if(wantAdmin&&isAdmin){wantAdmin=false;ss.del('wantAdmin');openAdmin();toast('Acesso do dono liberado.')}
  startRealtime();
  sb.auth.onAuthStateChange((ev,s)=>{
    if(ev==='INITIAL_SESSION'||ev==='TOKEN_REFRESHED')return;
    const now=s&&s.user?s.user.id:null;
    if(now===lastUid&&ev!=='USER_UPDATED')return;
    lastUid=now;
    setTimeout(()=>syncSession(s,ev).catch(x=>console.error(x)),0);
  });
})();
</script>
